name: Release

# Pushing to the release branch publishes package.json's version to npm, unless that version is
# already published, then tags it and creates a GitHub release.
on:
  push:
    branches: [release]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

# Actions are pinned to commits; the comments name the release.
jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # creates the tag and the GitHub release
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24 ships npm 11, which trusted publishing needs; Node 22 ships npm 10.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - name: Check whether this version is on npm
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@excalidraw/cli@$version" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@excalidraw/cli@$version is already on npm. Bump the version in package.json to release."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.published == 'false'
        run: pnpm install --frozen-lockfile
      # On a fresh runner, Chrome's first start can take over 30 s (likely while it builds font
      # caches), which hits the render tests' deadline. Start it once beforehand.
      - name: Warm up Chrome
        if: steps.version.outputs.published == 'false'
        run: timeout 300 google-chrome --headless --no-sandbox --disable-gpu --screenshot=/tmp/warm-up.png 'data:text/html,<p>warm up</p>'
      - if: steps.version.outputs.published == 'false'
        run: pnpm run test:render
      # prepublishOnly builds again and runs the offline suite. Prerelease versions, such as
      # 0.2.0-beta.1, are published under the next tag so they don't become the default install.
      - name: Publish
        if: steps.version.outputs.published == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # Only needed for the first publish: once trusted publishing is set up for the package on
          # npmjs.com, npm authenticates with the workflow's OIDC token and this secret can go.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm can't attest provenance for private repositories.
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}
        run: |
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          npm publish --access public --tag "$tag"
      # npm writes why trusted publishing didn't authenticate only to its debug log. The claims
      # are what npm matches against the trusted publisher settings; the token itself isn't printed.
      - name: Show npm's trusted publishing log
        if: failure()
        run: |
          grep -h oidc ~/.npm/_logs/*-debug-0.log || echo "No trusted publishing entries in npm's log."
          node -e '
            const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.set("audience", "npm:registry.npmjs.org");
            fetch(url, { headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` } })
              .then((response) => response.json())
              .then(({ value }) => {
                const claims = JSON.parse(Buffer.from(value.split(".")[1], "base64url").toString());
                const keys = ["repository", "repository_owner", "repository_visibility", "workflow_ref", "job_workflow_ref", "ref", "environment", "event_name", "runner_environment"];
                console.log(JSON.stringify(Object.fromEntries(keys.map((key) => [key, claims[key] ?? null])), null, 2));
              });
          '
      - name: Tag and create the GitHub release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists."
            exit 0
          fi
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --generate-notes "${prerelease[@]}"
